# --- Project identity ---
sonar.projectKey=wings-sdlc-demo
sonar.projectName=Wings SDLC Demo
sonar.projectVersion=0.1.0

# --- Sources (monorepo: Next.js frontend + NestJS backend) ---
# sonar.host.url and the auth token are injected by Jenkins (withSonarQubeEnv).
sonar.sources=apps/web/src,apps/api/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/*.spec.ts,**/coverage/**,**/*.config.*,**/.eslintrc.js

# --- Tests & coverage ---
sonar.tests=apps/api/src
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

sonar.sourceEncoding=UTF-8
